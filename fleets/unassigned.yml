policies:

  - name: macOS - Run post enrollment script
    description: Run post-enrollment script after Fleet enrollment and first user login.
    resolution: The script creates the post_enrollment_done flag after successful execution.
    platform: darwin
    critical: false
    query: |
      SELECT 1
      FROM file
      WHERE path = '/Library/Application Support/Sheriff Projects/post_enrollment_done';
    run_script:
      path: ../lib/macos/scripts/post-enrollment.sh

  - name: macOS - FortiCLient Installation
    description: |
      This policy checks that FortiClient is install
    platform: darwin
    query: |
      SELECT 1 FROM apps WHERE bundle_identifier = 'com.fortinet.FortiClient'
    install_software:
      package_path: ../lib/macos/software/forticlient.yml





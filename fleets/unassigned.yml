name: Unassigned

agent_options:
  config:
    options:
      pack_delimiter: /
      logger_tls_period: 10
      distributed_plugin: tls
      disable_distributed: false
      logger_tls_endpoint: /api/osquery/log
      distributed_interval: 10
      distributed_tls_max_attempts: 3

settings:
  webhook_settings:
    failing_policies_webhook:
      destination_url: ""
      enable_failing_policies_webhook: false
      host_batch_size: 0

controls:
  apple_settings:
    configuration_profiles:
      - path: ../lib/unassigned/profiles/Install_Maxitype_Signs_Font.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Apple_Osascript.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Apple_Terminal.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Avid_Nexis_Client.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Bombich_Carbon_Copy_Cloner.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Capture_One.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_DEVONTech_Xmenu.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_FleetDM_Orbit.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Fortinet_Forticlient.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Google_Chrome.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Microsoft_Teams.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Root3_SupportApp.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Ryan_Hanson_Rectangle.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Salesforce_Slack.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Sheriff_Projects_SP_Tools.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Sheriff_Projects_Smb_Link.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Wacom_Tablet.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Preferences_SP_Interne.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Eizo_ColorNavigator.mobileconfig
      - path: ../lib/unassigned/profiles/Settings_Microsoft_AutoUpdate.mobileconfig

      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU54_DSI.mobileconfig
        labels_include_any:
          - "BU54 - DSI"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU02_ATELIER.mobileconfig
        labels_include_any:
          - "BU02 - ATELIER"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU05_PUB.mobileconfig
        labels_include_any:
          - "BU05 - PUB"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU06_ECOM.mobileconfig
        labels_include_any:
          - "BU06 - ECOM"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU10_ULTRA_MOTION.mobileconfig
        labels_include_any:
          - "BU10 - ULTRA MOTION"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU53_DRH.mobileconfig
        labels_include_any:
          - "BU53 - DRH"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU51_DIRECTION.mobileconfig
        labels_include_any:
          - "BU51 - DIRECTION"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU52_COMPTABILITE.mobileconfig
        labels_include_any:
          - "BU52 - COMPTABILITE"
      - path: ../lib/unassigned/profiles/Settings_Chrome_Token_BU11_PRODUCTION.mobileconfig
        labels_include_any:
          - "BU11 - PRODUCTION"

  enable_disk_encryption: false
  enable_recovery_lock_password: false
  windows_require_bitlocker_pin: false

  # Laisse ces blocs absents si tu ne forces pas les mises a jour OS.
  macos_updates:
    deadline: ""
    minimum_version: ""
    update_new_hosts: false
  ios_updates:
    deadline: ""
    minimum_version: ""
  ipados_updates:
    deadline: ""
    minimum_version: ""
  windows_updates:
    deadline_days:
    grace_period_days:

  scripts:
    - path: ../lib/unassigned/scripts/set_user_picture.sh
    
  setup_experience:
    macos_bootstrap_package: ""
    apple_enable_release_device_manually: false
    apple_setup_assistant: ../lib/unassigned/json/dep_profile.json
    macos_script: ../lib/unassigned/scripts/create_users.sh

software:
  packages:
    - path: ../lib/unassigned/software/capture_one.yml
      self_service: true
    - path: ../lib/unassigned/software/color_navigator.yml
      display_name: ColorNavigator 7
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/carbon_copy_cloner.yml
      self_service: true
    - path: ../lib/unassigned/software/sp_wallpapers.yml
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/wacom_tablet.yml
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/dark_mode.yml
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/desktoppr.yml
      display_name: desktoppr
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/forticlient.yml
      display_name: FortiClient 7
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/forticlient_vpn_config.yml
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/wallpaper_folder.yml
      display_name: wallpaper_folder
      self_service: true
      setup_experience: true
    - path: ../lib/unassigned/software/microsoft_365.yml
      display_name: "Microsoft 365 Apps"
      self_service: true
      setup_experience: true
      categories:
        - Productivity

  app_store_apps:
    - app_store_id: "361285480"  # Keynote
      platform: darwin
      self_service: true
      categories:
        - Productivity

  fleet_maintained_apps:
    - slug: slack/darwin
      self_service: true
      setup_experience: true
      categories:
        - Communication
    - slug: google-chrome/darwin
      self_service: true
      setup_experience: true
    - slug: rectangle/darwin
      self_service: true
    - slug: zoom/darwin
      self_service: true
      setup_experience: true

policies:
  - path: ../lib/unassigned/policies/user_picture_applied.yml

reports: []

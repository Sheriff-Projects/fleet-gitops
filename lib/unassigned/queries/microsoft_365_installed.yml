apiVersion: v1
kind: query
spec:
  name: Microsoft 365 installed
  description: |
    Retourne une ligne si au moins un des composants principaux de Microsoft 365
    (Word, Excel, PowerPoint, Outlook) est installé sur la machine.
    Utilisé par Fleet pour afficher l'état "Installé" dans le Self-Service.
  platform: darwin
  query: |
    SELECT 1 FROM apps
    WHERE bundle_identifier IN (
      'com.microsoft.Word',
      'com.microsoft.Excel',
      'com.microsoft.Powerpoint',
      'com.microsoft.Outlook'
    )
    LIMIT 1;
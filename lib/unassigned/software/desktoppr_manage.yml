# ---------------------------------------------------------------------------
# DesktopprManage — outil pour gérer le wallpaper macOS via configuration profile
# https://github.com/scriptingosx/desktoppr
# ---------------------------------------------------------------------------
# Ce pkg installe :
#   - le binaire /usr/local/bin/desktoppr
#   - un LaunchAgent qui exécute `desktoppr manage` au login + toutes les 3h
#   - le LaunchAgent lit la config depuis le profil com.scriptingosx.desktoppr
#     (à pousser via lib/unassigned/profiles/Settings_Scriptingosx_Desktoppr.mobileconfig)
# ---------------------------------------------------------------------------
# Le pkg a été uploadé manuellement via l'UI Fleet.
# Pour mettre à jour : rebuild + ré-upload + remplacer le hash ci-dessous.
# ---------------------------------------------------------------------------

- url: https://raw.githubusercontent.com/souari1974/fleet-gitops/main/lib/unassigned/download/Desktoppr_Manage.pkg
  hash_sha256: 942dbf835c2aacc82019ef2666edf5dd592a25d2f6723f7b90fcdf38e56096cc
  icon:
    path: ../../all/icon/s_p.png
  install_script:
    path: ./install_Desktoppr_Manage.sh
  uninstall_script:
    path: ./uninstall_Desktoppr_Manage.sh
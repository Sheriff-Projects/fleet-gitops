# ---------------------------------------------------------------------------
# LABELS
# ---------------------------------------------------------------------------
# Les labels sont déclarés ici uniquement pour que fleetctl accepte le YAML
# (bug 4.84.x : ne respecte pas le flag exceptions.labels du serveur, et
# exige la présence de la clé `labels:` dans default.yml malgré l'exception).
#
# IMPORTANT : la clé `hosts:` est volontairement OMISE pour chaque label.
# Selon la doc Fleet (https://fleetdm.com/docs/configuration/yaml-files#labels) :
#   "If [hosts is] omitted, existing host membership is preserved (no changes)."
# Donc la membership manuelle gérée dans l'UI Fleet n'est PAS écrasée à chaque
# run GitOps. C'est exactement le comportement voulu : UI = source de vérité
# pour les assignations de devices aux BU.
# ---------------------------------------------------------------------------
